name: Build Release EXE

on:

  workflow_dispatch: # 允许手动点击触发编译

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. 升级到 checkout@v4
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 升级到 setup-dotnet@v4
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 3. 编译单文件独立的 EXE
    - name: Restore and Publish Single File EXE
      run: |
        dotnet publish SharePermissionsTool.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

    # 4. 升级到 upload-artifact@v4 (解决报错的关键)
    - name: Upload Built EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SharePermissionsTool_v4.0_Win64
        path: ./publish/SharePermissionsTool.exe
