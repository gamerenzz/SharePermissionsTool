name: Build Release EXE

on:

  workflow_dispatch: # 允许手动点击触发编译

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. 代码拉取
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 配置 .NET 8 SDK
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 3. 编译极轻量单文件 EXE (--self-contained false)
    - name: Restore and Publish Single File EXE
      run: |
        dotnet publish SharePermissionsTool.csproj -c Release -r win-x64 --self-contained false /p:PublishSingleFile=true -o ./publish

    # 4. 上传编译产物
    - name: Upload Built EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SharePermissionsTool_v4.0_Lightweight
        path: ./publish/SharePermissionsTool.exe
